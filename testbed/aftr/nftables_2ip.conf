#!/usr/sbin/nft -f
# ================================================================
# DS-Lite AFTR NAT44 / CGNAT — TWO-PUBLIC-IPv4 variant
# ================================================================
#
# Identical to nftables.conf except that the AFTR egresses subscribers
# on TWO public IPv4 addresses instead of one shared address:
#
#   B4-1 subscriber LAN 10.0.1.0/24  ->  192.0.2.1
#   B4-2 subscriber LAN 10.0.2.0/24  ->  192.0.2.2
#
# This partitions the subscriber population across two shared addresses
# so that the Affected-Population Scope levels Shared-IPv4 and AFTR-Wide
# can be separated empirically: a per-address abuse consequence (TS1)
# reaches only the subscribers behind one address, whereas an
# AFTR-hosted attack (e.g. the MIB disclosure T11) still reaches every
# subscriber regardless of which public address it egresses on.
#
# The caller (aps_two_ip.sh) assigns 192.0.2.2/24 to eth-wan before
# loading this ruleset, and reloads nftables.conf to restore the single
# shared-address default. Everything below the postrouting chain is
# byte-for-byte the single-address ruleset.
# ================================================================

flush ruleset

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        jump pcp_dnat
    }

    chain pcp_dnat {
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Two-public-IPv4 mode: subscribers partitioned across two
        # shared addresses (one per softwire), 1024-65535 random ports.
        ip saddr 10.0.1.0/24 meta l4proto tcp oif "eth-wan" snat to 192.0.2.1:1024-65535 random
        ip saddr 10.0.1.0/24 meta l4proto udp oif "eth-wan" snat to 192.0.2.1:1024-65535 random
        ip saddr 10.0.1.0/24 oif "eth-wan" snat to 192.0.2.1

        ip saddr 10.0.2.0/24 meta l4proto tcp oif "eth-wan" snat to 192.0.2.2:1024-65535 random
        ip saddr 10.0.2.0/24 meta l4proto udp oif "eth-wan" snat to 192.0.2.2:1024-65535 random
        ip saddr 10.0.2.0/24 oif "eth-wan" snat to 192.0.2.2
    }
}

table ip6 mangle {
    chain prerouting {
        type filter hook prerouting priority mangle; policy accept;
        ip6 nexthdr 4 meta mark set @nh,160,32
    }
}

table ip mangle {
    chain prerouting {
        type filter hook prerouting priority mangle; policy accept;
        meta mark != 0 ct mark set meta mark
        iifname "eth-wan" ct mark != 0 meta mark set ct mark
    }
}

table ip dslite_zone {
    chain prerouting {
        type filter hook prerouting priority raw; policy accept;
        iifname "ds-lite-b4-1" ct original zone set 1
        iifname "ds-lite-b4-2" ct original zone set 2
    }
}

table ip filter {
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid counter drop
        ct state established,related accept

        oif "eth-wan" ct state new \
            meter per_b4_connlimit { ct mark ct count over 2000 } \
            log prefix "AFTR-CONNLIMIT: " counter drop

        oif "eth-wan" ct state new \
            log prefix "AFTR-NAT-NEW: " counter accept

        iif "eth-wan" ct state new ct status dnat \
            log prefix "AFTR-DNAT-FWD: " counter accept

        iif "eth-wan" ct state new \
            log prefix "AFTR-DROP-UNSOLICITED: " counter drop

        counter
    }
}

table ip6 filter {
    chain input {
        type filter hook input priority filter; policy accept;
        ip6 nexthdr 44 counter
    }
}
